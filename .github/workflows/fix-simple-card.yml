name: Repair Simple English dataset card
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-simple-card.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-card:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SIMPLE_HF_REPO: ffatty/plain-text-wikipedia-simpleenglish
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugging Face
        run: python -m pip install huggingface_hub
      - name: Upload corrected card without rebuilding dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          repo = os.environ["SIMPLE_HF_REPO"]
          api = HfApi(token=os.environ["HF_TOKEN"])
          card = Path("config/hf-dataset-card.md").read_text()
          replacements = {
              "__LANG_PROJECT__": "simplewiki",
              "__LANG_CODE__": "en",
              "__LANG_NAME__": "Simple English",
              "__HF_REPO__": repo,
              "__SOURCE_URL__": "https://dumps.wikimedia.org/simplewiki/latest",
              "__REPO_URL__": "https://github.com/cheeseonamonkey/PlainTextWikipedia",
              "__UPSTREAM_URL__": "https://github.com/daveshap/PlainTextWikipedia",
          }
          for key, value in replacements.items():
              card = card.replace(key, value)
          Path("README-simple.md").write_text(card)
          api.upload_file(repo_id=repo, repo_type="dataset",
                          path_or_fileobj="README-simple.md", path_in_repo="README.md",
                          commit_message="Fix Simple English language metadata and dataset card")
          files = api.list_repo_files(repo, repo_type="dataset")
          shards = sorted(f for f in files if f.startswith("data/") and f.endswith(".txt.gz"))
          print(f'Published HF card: https://huggingface.co/datasets/{repo}')
          print(f'Shard files already in HF: {shards}')
          PY
