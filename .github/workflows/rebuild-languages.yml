name: Build all Wikipedia languages
run-name: Wikimedia corpus rebuild (${{ inputs.languages || 'all configured editions' }})

# Intentionally manual: the full inventory includes over 200 editions.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish complete bundles to all three targets
        type: boolean
        default: false
      languages:
        description: Comma-separated Wikipedia projects, blank for all cataloged editions
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: wikipedia-language-matrix
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.languages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: languages
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: python scripts/plan_wikipedia_languages.py --languages "$LANGUAGES"
  rebuild:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/rebuild-full.yml
    with:
      language: ${{ matrix.language }}
      publish: ${{ inputs.publish }}
    secrets: inherit
