name: Publish one Wikipedia dataset (original + Parquet)

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: Existing ffatty Wikipedia dataset
        required: true
        type: string
        default: ffatty/plain-text-wikipedia-simpleenglish
      mirror_kaggle:
        description: Publish the existing Kaggle dataset version
        type: boolean
        default: true
      publish_zenodo:
        description: Publish or version Parquet on Zenodo
        type: boolean
        default: true
      kaggle_stage_mb:
        description: Kaggle staging limit (MiB)
        type: number
        default: 5000

permissions:
  contents: read

concurrency:
  group: wiki-parquet-${{ inputs.repo_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REPO: ${{ inputs.repo_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      WANT_KAGGLE: ${{ inputs.mirror_kaggle }}
      WANT_ZENODO: ${{ inputs.publish_zenodo }}
      MAX_MB: ${{ inputs.kaggle_stage_mb }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub pyarrow requests kaggle six
      - name: Check enabled publishers before downloading large archives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import requests
          from huggingface_hub import HfApi
          e = os.environ
          if not e.get("HF_TOKEN"):
              raise SystemExit("::error::HF_TOKEN is missing")
          HfApi(token=e["HF_TOKEN"]).whoami()
          if e["WANT_ZENODO"] == "true":
              if not e.get("ZENODO_TOKEN"):
                  raise SystemExit("::error::ZENODO_TOKEN is missing")
              response = requests.get(
                  "https://zenodo.org/api/deposit/depositions",
                  params={"size": 1},
                  headers={"Authorization": "Bearer " + e["ZENODO_TOKEN"]}, timeout=30)
              response.raise_for_status()
          PY
          if [[ "$WANT_KAGGLE" == true ]]; then
            python scripts/kaggle_auth.py --owner ffatty
          fi

      - name: Build missing Parquet and publish to the existing Hugging Face dataset
        id: hf
        run: python scripts/structured_fleet.py build --repo "$REPO"

      - name: Publish original + Parquet to existing Kaggle dataset
        if: ${{ steps.hf.outcome == 'success' && inputs.mirror_kaggle }}
        id: kaggle
        continue-on-error: true
        run: |
          python scripts/kaggle_auth.py --owner ffatty
          python scripts/structured_kaggle.py --repo "$REPO" --max-mb "$MAX_MB" --require-publish

      - name: Publish verified Parquet to Zenodo
        if: ${{ steps.hf.outcome == 'success' && inputs.publish_zenodo }}
        id: zenodo
        continue-on-error: true
        run: python scripts/release_parquet.py --repo "$REPO" --publish

      - name: Report all enabled publishing outcomes
        if: always()
        shell: bash
        env:
          HF_STATUS: ${{ steps.hf.outcome }}
          KAGGLE_STATUS: ${{ steps.kaggle.outcome }}
          ZENODO_STATUS: ${{ steps.zenodo.outcome }}
        run: |
          echo "### $REPO" >> "$GITHUB_STEP_SUMMARY"
          echo "HF=$HF_STATUS Kaggle=$KAGGLE_STATUS Zenodo=$ZENODO_STATUS" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$HF_STATUS" == success ]] || exit 1
          [[ "$WANT_KAGGLE" != true || "$KAGGLE_STATUS" == success ]] || exit 1
          [[ "$WANT_ZENODO" != true || "$ZENODO_STATUS" == success ]] || exit 1
