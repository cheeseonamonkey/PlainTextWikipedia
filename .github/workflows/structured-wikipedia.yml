name: Publish one Wikipedia dataset (original + Parquet)

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: Existing ffatty Wikipedia dataset
        required: true
        type: string
        default: ffatty/plain-text-wikipedia-simpleenglish
      mirror_kaggle:
        description: Publish current version to Kaggle
        type: boolean
        default: true
      publish_zenodo:
        description: Publish or version Parquet on Zenodo
        type: boolean
        default: true
      kaggle_stage_mb:
        description: Kaggle staging cap in MiB (0 = automatic runner disk preflight)
        type: number
        default: 0
  workflow_call:
    inputs:
      repo_id:
        required: true
        type: string
      mirror_kaggle:
        type: boolean
        default: true
      publish_zenodo:
        type: boolean
        default: true
      kaggle_stage_mb:
        type: number
        default: 5000
      skip_preflight:
        description: Only set after the fleet controller has checked all enabled publishers
        type: boolean
        default: false
    secrets:
      HF_TOKEN:
        required: true
      KAGGLE_TOKEN:
        required: false
      ZENODO_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: ${{ inputs.repo_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: wiki-parquet-${{ inputs.repo_id }}
      cancel-in-progress: false
    env:
      REPO: ${{ inputs.repo_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      WANT_KAGGLE: ${{ inputs.mirror_kaggle }}
      WANT_ZENODO: ${{ inputs.publish_zenodo }}
      MAX_MB: ${{ inputs.kaggle_stage_mb }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publisher dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir huggingface_hub pyarrow requests kaggle six
      - name: Authenticate enabled publishers before expensive downloads
        if: ${{ !inputs.skip_preflight }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          [[ "$WANT_KAGGLE" == true ]] || args+=(--no-kaggle)
          [[ "$WANT_ZENODO" == true ]] || args+=(--no-zenodo)
          python scripts/publish_preflight.py "${args[@]}"

      - name: Build only missing Parquet; publish to existing Hugging Face dataset
        id: hf
        run: python scripts/structured_fleet.py build --repo "$REPO"

      - name: Publish original + Parquet into existing Kaggle dataset
        if: ${{ steps.hf.outcome == 'success' && inputs.mirror_kaggle }}
        id: kaggle
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/kaggle_auth.py --owner ffatty
          python scripts/structured_kaggle.py --repo "$REPO" --max-mb "$MAX_MB" --require-publish

      - name: Publish or version verified Parquet DOI on Zenodo
        if: ${{ steps.hf.outcome == 'success' && inputs.publish_zenodo }}
        id: zenodo
        continue-on-error: true
        run: python scripts/release_parquet.py --repo "$REPO" --publish

      - name: Summarize all enabled destinations; fail explicitly on partial release
        if: always()
        shell: bash
        env:
          HF_STATUS: ${{ steps.hf.outcome }}
          KAGGLE_STATUS: ${{ steps.kaggle.outcome }}
          ZENODO_STATUS: ${{ steps.zenodo.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### $REPO"
            echo "| Destination | Result |"
            echo "|---|---|"
            echo "| Hugging Face | $HF_STATUS |"
            echo "| Kaggle | $KAGGLE_STATUS |"
            echo "| Zenodo | $ZENODO_STATUS |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$HF_STATUS" == success ]] || exit 1
          [[ "$WANT_KAGGLE" != true || "$KAGGLE_STATUS" == success ]] || exit 1
          [[ "$WANT_ZENODO" != true || "$ZENODO_STATUS" == success ]] || exit 1
