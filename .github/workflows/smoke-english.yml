name: Smoke-test English Wikipedia dumps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language: [simplewiki, enwiki]
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r REQUIREMENTS.TXT
      - name: Download current official dump
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LANGUAGE" == "simplewiki" ]]; then
            url='https://dumps.wikimedia.org/simplewiki/latest/simplewiki-latest-pages-articles.xml.bz2'
          else
            url="$(python - <<'PY'
          from scripts.download_page_ranges import page_range_catalog, latest_page_ranges
          base = "https://dumps.wikimedia.org/enwiki/latest"
          files = latest_page_ranges(page_range_catalog(base, "enwiki"))
          numbered = [f for f in files if ".xml-p" in f[2] and f[4] > 0]
          if not numbered:
              raise SystemExit("No completed English page-range archive")
          print(f"{base}/{min(numbered, key=lambda f: f[4])[2]}")
          PY
            )"
          fi
          echo "Downloading $url"
          curl --fail --location --retry 4 --retry-delay 5 --output source.xml.bz2 "$url"
          test -s source.xml.bz2
      - name: Convert and validate without publishing
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'elapsed=%es peak_kib=%M' python wiki_to_text.py \
            source.xml.bz2 output --output-name sample.txt.gz | tee conversion.log
          gzip -t output/sample.txt.gz
          python - <<'PY'
          import os, re
          from pathlib import Path
          log = Path("conversion.log").read_text()
          match = re.search(r"Wrote ([\d,]+) articles", log)
          assert match, "Missing conversion count"
          count = int(match.group(1).replace(",", ""))
          assert count > 1_000, f"Unexpectedly few articles: {count}"
          size = Path("output/sample.txt.gz").stat().st_size
          print(f"PASS {os.environ['LANGUAGE']}: {count:,} articles, {size:,} compressed bytes")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(f"### {os.environ['LANGUAGE']}\n\n{count:,} articles; {size:,} compressed bytes.\n")
          PY
