name: Zenodo Parquet research release

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: Existing Hugging Face Wikipedia dataset (ffatty/...)
        required: true
        type: string
        default: ffatty/plain-text-wikipedia-simpleenglish
      publish:
        description: Publish or version a Zenodo Parquet DOI (disable for validation only)
        type: boolean
        default: true
      existing_record_id:
        description: Existing Zenodo deposition ID to create a NEW version; otherwise blank
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: zenodo-wikipedia-${{ inputs.repo_id }}
  cancel-in-progress: false

jobs:
  zenodo:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      SOURCE_REPO: ${{ inputs.repo_id }}
      ZENODO_ID: ${{ inputs.existing_record_id }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub requests
      - name: Check Parquet completeness, source checksums, and Zenodo record limits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_parquet.py --repo "$SOURCE_REPO"
      - name: Publish Parquet-only research record
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          opts=(--repo "$SOURCE_REPO" --publish)
          if [[ -n "$ZENODO_ID" ]]; then
            [[ "$ZENODO_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            opts+=(--zenodo-id "$ZENODO_ID")
          fi
          python scripts/release_parquet.py "${opts[@]}"
