name: Build Wikipedia language dataset
run-name: Wikipedia (${{ inputs.language }}) ${{ inputs.publish && '— publish' || '— build-only' }}

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language prefix (en, zh, es, simple, enwiki, ...)
        type: string
        required: true
      publish:
        description: Publish the verified parquet bundle to HF + Kaggle + Zenodo (parallel, independent)
        type: boolean
        default: true
      rebuild:
        description: Force a fresh Wikimedia dump conversion instead of reusing existing HF sources
        type: boolean
        default: false
      vocab:
        description: Shared stemmed vocabulary size for fastText + TF-IDF
        type: number
        default: 12000
      dim:
        description: fastText embedding dimension
        type: number
        default: 180
      window:
        description: fastText context window
        type: number
        default: 8
      epoch:
        description: fastText training epochs
        type: number
        default: 1
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      publish:
        type: boolean
        default: true
      rebuild:
        type: boolean
        default: false
      vocab:
        type: number
        default: 12000
      dim:
        type: number
        default: 180
      window:
        type: number
        default: 8
      epoch:
        type: number
        default: 1
    secrets:
      HF_TOKEN:
        required: false
      KAGGLE_TOKEN:
        required: false
      ZENODO_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      repo: ${{ steps.resolve.outputs.repo }}
      code: ${{ steps.resolve.outputs.code }}
      project: ${{ steps.resolve.outputs.project }}
      mode: ${{ steps.resolve.outputs.mode }}
    env:
      LANGUAGE: ${{ inputs.language }}
      REBUILD: ${{ inputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links vendor/wheels huggingface_hub
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts.wiki_metadata import resolve_language
          repo, project, code = resolve_language(os.environ["LANGUAGE"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"repo={repo}", file=out)
              print(f"code={code}", file=out)
              print(f"project={project}", file=out)
          PY
          if [[ "$REBUILD" == "true" ]]; then echo "mode=rebuild" >> "$GITHUB_OUTPUT"; else echo "mode=existing" >> "$GITHUB_OUTPUT"; fi

  # Fresh-dump path: convert Wikimedia dumps into shard artifacts.
  rebuild:
    needs: resolve
    if: needs.resolve.outputs.mode == 'rebuild'
    uses: ./.github/workflows/rebuild-shards.yml
    with:
      language: ${{ needs.resolve.outputs.project }}
    secrets: inherit

  stage:
    needs: [resolve, rebuild]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.resolve.outputs.mode != 'rebuild' || needs.rebuild.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LANGUAGE: ${{ inputs.language }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links vendor/wheels -r requirements-features.txt
      - name: Download existing sources
        if: needs.resolve.outputs.mode == 'existing'
        run: python -m scripts.build_language --language "$LANGUAGE" --stage-only sources
      - name: Collect converted source artifacts (fresh rebuild)
        if: needs.resolve.outputs.mode == 'rebuild'
        uses: actions/download-artifact@v4
        with:
          pattern: full-${{ needs.resolve.outputs.project }}-*
          merge-multiple: true
          path: sources
      - name: Retain staged sources for build
        uses: actions/upload-artifact@v4
        with:
          name: staged-sources-${{ needs.resolve.outputs.code }}
          path: sources/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  corpus-stats:
    needs: [resolve, stage]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.stage.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      code: ${{ needs.resolve.outputs.code }}
      repo: ${{ needs.resolve.outputs.repo }}
      mode: ${{ needs.resolve.outputs.mode }}
    env:
      LANGUAGE: ${{ inputs.language }}
      VOCAB: ${{ inputs.vocab }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: python -m pip install --no-index --find-links vendor/wheels -r requirements-features.txt
      - name: Download staged sources
        uses: actions/download-artifact@v4
        with:
          name: staged-sources-${{ needs.resolve.outputs.code }}
          path: sources
      - name: Index the corpus and fit the shared vocabulary
        run: >-
          python -m scripts.build_language --language "$LANGUAGE" --stage corpus-stats
          --sources sources --work work --vocab "$VOCAB"
      - name: Retain the corpus index for training
        uses: actions/upload-artifact@v4
        with:
          name: features-${{ needs.resolve.outputs.code }}-corpus
          path: work/corpus-stats/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Retain the verified source manifest
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest-${{ needs.resolve.outputs.code }}
          path: sources/build-manifest.json
          if-no-files-found: error
          retention-days: 1

  fasttext-training:
    needs: corpus-stats
    if: ${{ !cancelled() && needs.corpus-stats.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LANGUAGE: ${{ inputs.language }}
      DIM: ${{ inputs.dim }}
      WINDOW: ${{ inputs.window }}
      EPOCH: ${{ inputs.epoch }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: python -m pip install --no-index --find-links vendor/wheels -r requirements-features.txt
      - name: Download the corpus index
        uses: actions/download-artifact@v4
        with:
          name: features-${{ needs.corpus-stats.outputs.code }}-corpus
          path: work/corpus-stats
      - name: Train fastText on the shared vocabulary
        run: >-
          python -m scripts.build_language --language "$LANGUAGE" --stage fasttext-training
          --work work --dim "$DIM" --window "$WINDOW" --epoch "$EPOCH"
      - name: Retain the trained model
        uses: actions/upload-artifact@v4
        with:
          name: features-${{ needs.corpus-stats.outputs.code }}-model
          path: work/fasttext-training/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  enrich-parquet:
    needs: [resolve, fasttext-training]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.fasttext-training.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      code: ${{ needs.resolve.outputs.code }}
      repo: ${{ needs.resolve.outputs.repo }}
      mode: ${{ needs.resolve.outputs.mode }}
    env:
      LANGUAGE: ${{ inputs.language }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: python -m pip install --no-index --find-links vendor/wheels -r requirements-features.txt
      - name: Download the corpus index
        uses: actions/download-artifact@v4
        with:
          name: features-${{ needs.resolve.outputs.code }}-corpus
          path: work/corpus-stats
      - name: Download the trained model
        uses: actions/download-artifact@v4
        with:
          name: features-${{ needs.resolve.outputs.code }}-model
          path: work/fasttext-training
      - name: Download converted sources (fresh rebuild only)
        if: needs.resolve.outputs.mode == 'rebuild'
        uses: actions/download-artifact@v4
        with:
          name: staged-sources-${{ needs.resolve.outputs.code }}
          path: sources
      - name: Download the verified source manifest (fresh rebuild only)
        if: needs.resolve.outputs.mode == 'rebuild'
        uses: actions/download-artifact@v4
        with:
          name: source-manifest-${{ needs.resolve.outputs.code }}
          path: sources
      - name: Embed every article and verify the bundle
        run: >-
          python -m scripts.build_language --language "$LANGUAGE" --stage enrich-parquet
          --work work --release release
      - name: Retain verified bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: wikipedia-${{ needs.resolve.outputs.code }}
          path: release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain converted sources for publisher upload (fresh rebuild)
        if: needs.resolve.outputs.mode == 'rebuild'
        uses: actions/upload-artifact@v4
        with:
          name: sources-${{ needs.resolve.outputs.code }}
          path: |
            sources/*.txt.gz
            sources/build-manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  # Always runs after the enrich stage to expose the exact condition values
  # downstream jobs evaluate; diagnoses skipped-publisher outcomes.
  debug:
    needs: enrich-parquet
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Print publish condition context
        shell: bash
        run: |
          echo "inputs.publish = '${{ inputs.publish }}' (type: ${{ inputs.publish && 'truthy' || 'falsy' }})"
          echo "needs.enrich-parquet.result = '${{ needs.enrich-parquet.result }}'"
          echo "github.event_name = '${{ github.event_name }}'"
          echo "github.event.inputs.publish = '${{ github.event.inputs.publish }}'"

  publish-hf:
    needs: enrich-parquet
    if: ${{ !cancelled() && inputs.publish && needs.enrich-parquet.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANGUAGE: ${{ inputs.language }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links vendor/wheels -r requirements-features.txt
      - uses: actions/download-artifact@v4
        with:
          name: wikipedia-${{ needs.enrich-parquet.outputs.code }}
          path: release
      - name: Download rebuilt sources (fresh rebuild only)
        if: needs.enrich-parquet.outputs.mode == 'rebuild'
        uses: actions/download-artifact@v4
        with:
          name: sources-${{ needs.enrich-parquet.outputs.code }}
          path: sources
      - name: Publish bundle and rebuilt sources to Hugging Face
        shell: bash
        run: |
          args=(--language "$LANGUAGE" --folder release)
          if [[ -d sources ]]; then args+=(--sources-dir sources); fi
          python -m scripts.publish_hf "${args[@]}"

  publish-kaggle:
    needs: enrich-parquet
    if: ${{ !cancelled() && inputs.publish && needs.enrich-parquet.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LANGUAGE: ${{ inputs.language }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links vendor/wheels -r requirements-features.txt
      - uses: actions/download-artifact@v4
        with:
          name: wikipedia-${{ needs.enrich-parquet.outputs.code }}
          path: release
      - name: Authenticate Kaggle CLI
        run: python scripts/kaggle_auth.py --owner ffatty
      - run: python -m scripts.publish_kaggle --language "$LANGUAGE" --folder release

  publish-zenodo:
    needs: enrich-parquet
    if: ${{ !cancelled() && inputs.publish && needs.enrich-parquet.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LANGUAGE: ${{ inputs.language }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links vendor/wheels -r requirements-features.txt
      - uses: actions/download-artifact@v4
        with:
          name: wikipedia-${{ needs.enrich-parquet.outputs.code }}
          path: release
      - run: python -m scripts.publish_zenodo --language "$LANGUAGE" --folder release

  report:
    needs: [resolve, enrich-parquet, publish-hf, publish-kaggle, publish-zenodo]
    if: always() && inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize independent publisher outcomes
        shell: bash
        run: |
          {
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Build (corpus-stats / fasttext-training / enrich-parquet) | ${{ needs.enrich-parquet.result }} |"
            echo "| Hugging Face | ${{ needs['publish-hf'].result }} |"
            echo "| Kaggle | ${{ needs['publish-kaggle'].result }} |"
            echo "| Zenodo | ${{ needs['publish-zenodo'].result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.enrich-parquet.result }}" != success || "${{ needs['publish-hf'].result }}" != success || "${{ needs['publish-kaggle'].result }}" != success || "${{ needs['publish-zenodo'].result }}" != success ]]; then
            echo "::error::One or more publishers failed; the build bundle artifact is retained for retry"
            exit 1
          fi
