name: Publish rebuilt Wikipedia bundle
on:
  workflow_call:
    inputs:
      publish:
        description: Publish complete bundle to all three targets
        type: boolean
        default: false
      language:
        type: string
        required: true
      count:
        type: string
      source_run_id:
        type: string
      hf_repo:
        type: string
      kaggle_dataset:
        type: string
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.resolve.outputs.hf_repo }}
    env:
      LANGUAGE: ${{ inputs.language }}
      HF_REPO_INPUT: ${{ inputs.hf_repo }}
      KAGGLE_DATASET_INPUT: ${{ inputs.kaggle_dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve language and publishing destinations
        id: resolve
        shell: bash
        run: |
          python - <<'PYCODE'
          import os
          from scripts.wiki_metadata import project_repo, wiki_code
          project = os.environ["LANGUAGE"]
          repo = os.environ.get("HF_REPO_INPUT") or project_repo(project)
          kaggle = os.environ.get("KAGGLE_DATASET_INPUT") or repo
          if repo != kaggle or wiki_code(repo) + "wiki" != project:
              raise ValueError("Language and publisher destinations must agree")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"hf_repo={repo}", file=output)
          PYCODE
  publish:
    needs: resolve
    uses: ./.github/workflows/article-features-one.yml
    with:
      repo_id: ${{ needs.resolve.outputs.repo }}
      source_run_id: ${{ inputs.source_run_id || github.run_id }}
      language: ${{ inputs.language }}
      publish: ${{ inputs.publish }}
    secrets: inherit
