name: Refresh Simple English dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 1 */3 *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install converter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r REQUIREMENTS.TXT kaggle

      - name: Download current Simple English dump
        run: |
          curl --fail --location --retry 4 --retry-delay 10 \
            --output simplewiki.xml.bz2 \
            https://dumps.wikimedia.org/simplewiki/latest/simplewiki-latest-pages-articles-multistream.xml.bz2

      - name: Convert to compressed plaintext
        run: python wiki_to_text.py simplewiki.xml.bz2 output --prefix simplewiki

      - name: Validate output
        run: |
          test -s output/simplewiki_01_of_01.txt.gz
          gzip -t output/simplewiki_01_of_01.txt.gz
          test "$(gzip -cd output/simplewiki_01_of_01.txt.gz | wc -l)" -gt 0

      - name: Configure Kaggle credentials
        if: ${{ env.KAGGLE_JSON != '' }}
        run: |
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_JSON" > "$HOME/.kaggle/kaggle.json"
          chmod 600 "$HOME/.kaggle/kaggle.json"

      - name: Publish to Kaggle
        if: ${{ env.KAGGLE_JSON != '' }}
        run: |
          cp kaggle-metadata.json output/dataset-metadata.json
          kaggle datasets version -p output \
            -m "Refresh Simple English Wikipedia ($(date -u +%Y-%m-%d))" --dir-mode zip

      - name: Publish to Hugging Face
        if: ${{ env.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          hf upload ffatty/plain-text-wikipedia-simpleenglish output \
            --repo-type dataset --token "$HF_TOKEN" --path-in-repo data \
            --commit-message "Refresh Simple English Wikipedia ($(date -u +%Y-%m-%d))"
