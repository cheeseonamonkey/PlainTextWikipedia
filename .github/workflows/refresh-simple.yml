name: Refresh Simple English dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 1 */3 *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Load dataset configuration
        run: |
          set -a
          . config/datasets.env
          set +a
          for name in SIMPLE_SOURCE_URL SIMPLE_KAGGLE_DATASET SIMPLE_HF_REPO SIMPLE_SHARD_COUNT; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      - name: Install converter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r REQUIREMENTS.TXT kaggle six huggingface_hub

      - name: Download current Simple English dump
        run: |
          curl --fail --location --retry 4 --retry-delay 10             --output simplewiki.xml.bz2 "$SIMPLE_SOURCE_URL"

      - name: Convert to compressed plaintext
        run: python wiki_to_text.py simplewiki.xml.bz2 output --prefix simplewiki --shards "$SIMPLE_SHARD_COUNT"

      - name: Validate output
        run: |
          test -s output/simplewiki_01_of_01.txt.gz
          gzip -t output/simplewiki_01_of_01.txt.gz
          test "$(gzip -cd output/simplewiki_01_of_01.txt.gz | wc -l)" -gt 0

      - name: Publish refreshed source data to Hugging Face first
        if: ${{ env.HF_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          hf upload "$SIMPLE_HF_REPO" output \
            --repo-type dataset --token "$HF_TOKEN" --path-in-repo data \
            --commit-message "Refresh Simple English Wikipedia ($(date -u +%Y-%m-%d))"

      - name: Check Kaggle CLI credentials before updating existing version
        id: kaggle
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KAGGLE_TOKEN" ]] && python scripts/kaggle_auth.py --owner ffatty; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Kaggle unavailable; Hugging Face refresh is independent"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish complete Kaggle version with existing files retained
        if: ${{ steps.kaggle.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Never version new raw text alongside stale Parquet/SQLite.
          kaggle datasets files "$SIMPLE_KAGGLE_DATASET" --csv > "$RUNNER_TEMP/previous-files.csv"
          if grep -Eq '\.parquet|\.sqlite\.zst' "$RUNNER_TEMP/previous-files.csv"; then
            echo "::warning::Existing Kaggle structured files must be regenerated first; defer this Kaggle version until the structured-fleet rollout."
            exit 0
          fi
          mkdir -p current
          kaggle datasets download -d "$SIMPLE_KAGGLE_DATASET" -p current --unzip
          cp output/*.txt.gz current/
          cp kaggle-metadata.json current/dataset-metadata.json
          sed -i "s#ffatty/plain-text-wikipedia-simpleenglish#$SIMPLE_KAGGLE_DATASET#" current/dataset-metadata.json
          kaggle datasets version -p current \
            -m "Refresh Simple English Wikipedia ($(date -u +%Y-%m-%d))" \
            --dir-mode skip --keep-tabular

      - name: Free runner disk
        if: always()
        run: |
          rm -rf output current simplewiki.xml.bz2
