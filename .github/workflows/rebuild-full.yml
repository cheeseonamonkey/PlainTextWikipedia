name: Rebuild Wikipedia shards

on:
  workflow_dispatch:
    inputs:
      language:
        description: Wikimedia project code (e.g. eswiki or zhwiki)
        required: true
        default: enwiki
        type: string
      kaggle_dataset:
        description: Optional Kaggle destination override
        required: false
        type: string
      hf_repo:
        description: Optional Hugging Face destination override
        required: false
        type: string
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      kaggle_dataset:
        required: false
        type: string
      hf_repo:
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      mode: ${{ steps.plan.outputs.mode }}
      archive_bytes: ${{ steps.plan.outputs.archive_bytes }}
      snapshot: ${{ steps.plan.outputs.snapshot }}
    env:
      LANGUAGE: ${{ inputs.language }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LANGUAGE" =~ ^[a-z][a-z0-9_-]*wiki$ ]] || exit 1
          . config/datasets.env
          plan="$(python scripts/multistream_shards.py plan \
            --base-url "https://dumps.wikimedia.org/$LANGUAGE/latest" \
            --language "$LANGUAGE" --max-shards "$FULL_SHARD_COUNT")"
          python - "$plan" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          p=json.loads(sys.argv[1])
          n=int(p["count"])
          assert 1<=n<=64
          print(f"count={n}")
          print(f"shards={json.dumps(list(range(1,n+1)))}")
          print(f"mode={p['mode']}")
          print(f"archive_bytes={p['archive_bytes']}")
          print(f"snapshot={p.get('snapshot','')}")
          print(f"::notice::Wikipedia source: {p['reason']}, {n} planned shard jobs",
                file=sys.stderr)
          PY

  build:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LANGUAGE: ${{ inputs.language }}
      SHARD: ${{ matrix.shard }}
      COUNT: ${{ needs.plan.outputs.count }}
      MODE: ${{ needs.plan.outputs.mode }}
      ARCHIVE_BYTES: ${{ needs.plan.outputs.archive_bytes }}
      SNAPSHOT: ${{ needs.plan.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v4
      - name: Install converter dependencies
        run: python -m pip install -r REQUIREMENTS.TXT
      - name: Download assigned page ranges
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == "indexed" ]]; then
            python scripts/multistream_shards.py fetch \
              --base-url "https://dumps.wikimedia.org/$LANGUAGE/latest" \
              --language "$LANGUAGE" --shard "$((SHARD - 1))" \
              --count "$COUNT" --expected-size "$ARCHIVE_BYTES" \
              --output-dir ranges > ranges.txt
            printf '[]\n' > download-failures.json
          elif [[ "$MODE" == "current_export" ]]; then
            python scripts/current_export.py fetch \
              --language "$LANGUAGE" --shard "$((SHARD - 1))" \
              --count "$COUNT" --snapshot "$SNAPSHOT" \
              --output-dir ranges --failures-file download-failures.json > ranges.txt
          else
            python scripts/download_page_ranges.py \
              --base-url "https://dumps.wikimedia.org/$LANGUAGE/latest" \
              --language "$LANGUAGE" --shard "$((SHARD - 1))" \
              --shard-count "$COUNT" --output-dir ranges \
              --allow-partial --failures-file download-failures.json > ranges.txt
          fi
          test -s ranges.txt
      - name: Convert with recursive a/b splitting on failure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/convert_adaptive.py \
            --language "$LANGUAGE" --shard "$SHARD" --count "$COUNT" \
            --ranges-file ranges.txt --failures-file download-failures.json \
            --max-depth 3 --max-seconds 19000 --output-dir output
      - name: Stage successful leaves and split manifest even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ inputs.language }}-${{ matrix.shard }}
          path: |
            output/*.txt.gz
            output/*.manifest.json
          compression-level: 0
          if-no-files-found: warn
          retention-days: 1
      - name: Free runner disk
        if: always()
        run: rm -rf output ranges ranges.txt download-failures.json

  publish:
    needs: [plan, build]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LANGUAGE: ${{ inputs.language }}
      COUNT: ${{ needs.plan.outputs.count }}
      HF_REPO_INPUT: ${{ inputs.hf_repo }}
      KAGGLE_DATASET_INPUT: ${{ inputs.kaggle_dataset }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve language and publishing destinations
        shell: bash
        run: |
          set -euo pipefail
          . config/datasets.env
          code="${LANGUAGE%wiki}"
          hf_key="FULL_HF_REPO_${code^^}"
          kaggle_key="FULL_KAGGLE_DATASET_${code^^}"
          hf_id="$HF_REPO_INPUT"
          kaggle_id="$KAGGLE_DATASET_INPUT"
          if [[ -z "$hf_id" ]]; then hf_id="${!hf_key:-}"; fi
          if [[ -z "$kaggle_id" ]]; then kaggle_id="${!kaggle_key:-}"; fi
          case "$code" in
            en) name=English ;; es) name=Spanish ;; fr) name=French ;;
            de) name=German ;; it) name=Italian ;; pt) name=Portuguese ;;
            ru) name=Russian ;; zh) name=Chinese ;; no) name=Norwegian ;;
            *) name="" ;;
          esac
          if [[ -z "$name" ]]; then
            IFS='|' read -r name slug < <(python scripts/language_info.py "$LANGUAGE")
            if [[ -z "$hf_id" ]]; then hf_id="ffatty/plaintext-wikipedia-full-$slug"; fi
            if [[ -z "$kaggle_id" ]]; then kaggle_id="ffatty/plaintext-wikipedia-full-$slug"; fi
          fi
          echo "FULL_HF_REPO=$hf_id" >> "$GITHUB_ENV"
          echo "FULL_KAGGLE_DATASET=$kaggle_id" >> "$GITHUB_ENV"
          echo "LANG_CODE=$code" >> "$GITHUB_ENV"
          echo "LANG_NAME=$name" >> "$GITHUB_ENV"
          echo "SOURCE_REPO_URL=$SOURCE_REPO_URL" >> "$GITHUB_ENV"
          echo "UPSTREAM_REPO_URL=$UPSTREAM_REPO_URL" >> "$GITHUB_ENV"
          echo "HF=$hf_id Kaggle=$kaggle_id"
      - name: Collect built shards
        uses: actions/download-artifact@v4
        with:
          pattern: full-${{ inputs.language }}-*
          merge-multiple: true
          path: publish
      - name: Losslessly repack small editions into 16 published archives
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repack_shards.py --directory publish --target 16
      - name: Inspect successful leaves, verify exact recovery coverage
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inspect_adaptive.py \
            --language "$LANGUAGE" --count "$COUNT" \
            --directory publish --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Publish to Hugging Face
        id: hf_publish
        continue-on-error: true
        if: ${{ steps.inspect.outputs.available == 'true' && env.HF_TOKEN != '' && env.FULL_HF_REPO != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install huggingface_hub
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          import json
          e = os.environ
          api = HfApi(token=e["HF_TOKEN"])
          repo = e["FULL_HF_REPO"]
          api.create_repo(repo_id=repo, repo_type="dataset", exist_ok=True)
          card = Path("config/hf-dataset-card.md").read_text()
          replacements = {
              "__LANG_PROJECT__": e["LANGUAGE"],
              "__LANG_CODE__": e["LANG_CODE"],
              "__LANG_NAME__": e["LANG_NAME"],
              "__HF_REPO__": repo,
              "__SOURCE_URL__": f'https://dumps.wikimedia.org/{e["LANGUAGE"]}/latest',
              "__REPO_URL__": e["SOURCE_REPO_URL"],
              "__UPSTREAM_URL__": e["UPSTREAM_REPO_URL"],
          }
          for token, value in replacements.items():
              card = card.replace(token, value)
          manifest = json.loads(Path("publish/build-manifest.json").read_text())
          n = manifest["published_shards"]
          expected = manifest["expected_shards"]
          missing = manifest["missing_shards"]
          incomplete = manifest["incomplete_shards"]
          archives = manifest["published_archives"]
          status = ("COMPLETE" if manifest["complete"] else "PARTIAL")
          warning = (
              f"**Build status: {status} — {n}/{expected} root shards recovered "
              f"({archives} leaf archives).** "
              + (f"Missing roots: {missing}; incompletely recovered roots: {incomplete}. "
                 "See data/build-manifest.json for failed subranges and coverage."
                 if not manifest["complete"] else "All planned page ranges recovered.")
              + "\n\n")
          card = card.replace("## Format", warning + "## Format", 1)
          Path("publish/README.md").write_text(card, encoding="utf-8")
          # Upload small independent commits instead of one multi-GB commit.
          # This also allows a transient 429/500/504 to retry one leaf only.
          import time
          def retry_upload(description, action):
              for attempt in range(5):
                  try:
                      return action()
                  except Exception as exc:
                      if attempt == 4:
                          raise
                      delay = min(120, 10 * 2 ** attempt)
                      print(f"Retrying {description} in {delay}s: {exc}", flush=True)
                      time.sleep(delay)
          current = sorted(Path("publish").glob("*.txt.gz"))
          wanted = {f"data/{file.name}" for file in current}
          existing = set(api.list_repo_files(repo, repo_type="dataset"))
          for file in current:
              retry_upload(file.name, lambda file=file: api.upload_file(
                  repo_id=repo, repo_type="dataset",
                  path_or_fileobj=str(file), path_in_repo=f"data/{file.name}",
                  commit_message=f'Update {e["LANG_NAME"]} leaf {file.name}'))
          retry_upload("build-manifest.json", lambda: api.upload_file(
              repo_id=repo, repo_type="dataset",
              path_or_fileobj="publish/build-manifest.json",
              path_in_repo="data/build-manifest.json",
              commit_message=f'Publish coverage for {e["LANG_NAME"]} ({n}/{expected})'))
          retry_upload("README.md", lambda: api.upload_file(
              repo_id=repo, repo_type="dataset",
              path_or_fileobj="publish/README.md", path_in_repo="README.md",
              commit_message=f'Update {e["LANG_NAME"]} dataset card'))
          for obsolete in sorted(existing - wanted):
              if obsolete.startswith("data/") and obsolete.endswith(".txt.gz"):
                  retry_upload(f"delete {obsolete}", lambda obsolete=obsolete: api.delete_file(
                      repo_id=repo, repo_type="dataset", path_in_repo=obsolete,
                      commit_message=f"Remove obsolete {obsolete}"))
          print(f"Uploaded {len(current)} leaves; removed obsolete compressed archives")
          print(f"https://huggingface.co/datasets/{repo}")
          PY
      - name: Publish to Kaggle
        id: kaggle_publish
        continue-on-error: true
        if: ${{ always() && steps.inspect.outputs.available == 'true' && env.KAGGLE_TOKEN != '' && env.FULL_KAGGLE_DATASET != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install kaggle
          if [[ "$KAGGLE_TOKEN" == \{* ]]; then
            mkdir -p "$HOME/.kaggle"
            printf '%s' "$KAGGLE_TOKEN" > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
          else
            export KAGGLE_API_TOKEN="$KAGGLE_TOKEN"
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          e = os.environ
          meta = json.loads(Path("kaggle-metadata-full.json").read_text())
          meta["id"] = e["FULL_KAGGLE_DATASET"]
          meta["title"] = f'Plaintext Wikipedia ({e["LANG_NAME"]})'
          meta["description"] = meta["description"].replace("English", e["LANG_NAME"])
          meta["description"] = meta["description"].replace("__REPO_URL__", e["SOURCE_REPO_URL"])
          meta["description"] = meta["description"].replace("__UPSTREAM_URL__", e["UPSTREAM_REPO_URL"])
          manifest = json.loads(Path("publish/build-manifest.json").read_text())
          n, expected = manifest["published_shards"], manifest["expected_shards"]
          meta["description"] += (
              f"\n\nBuild status: {'complete' if manifest['complete'] else 'PARTIAL'} "
              f"({n}/{expected} root shards; {manifest['published_archives']} leaf files). "
              f"Missing roots: {manifest['missing_shards']}; "
              f"incomplete roots: {manifest['incomplete_shards']}. "
              "See build-manifest.json for exact coverage."
          )
          Path("publish/dataset-metadata.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2))
          PY
          if kaggle datasets files -d "$FULL_KAGGLE_DATASET" >/dev/null 2>&1; then
            kaggle datasets version -p publish -m "Rebuild $LANG_NAME Wikipedia $(date -u +%F)" --dir-mode skip
          else
            kaggle datasets create -p publish --public --dir-mode skip
          fi
          echo "https://www.kaggle.com/datasets/$FULL_KAGGLE_DATASET"
      - name: Report publishing errors
        if: ${{ always() && steps.inspect.outputs.available == 'true' }}
        shell: bash
        env:
          HF_RESULT: ${{ steps.hf_publish.outcome }}
          KAGGLE_RESULT: ${{ steps.kaggle_publish.outcome }}
        run: |
          echo "HF publication: $HF_RESULT; Kaggle publication: $KAGGLE_RESULT"
          if [[ "$HF_RESULT" == failure || "$KAGGLE_RESULT" == failure ]]; then
            echo "::error::At least one publishing destination failed"
            exit 1
          fi
      - name: Delete run shard artifacts after confirmed publication
        if: ${{ always() && (steps.hf_publish.outcome == 'success' || steps.kaggle_publish.outcome == 'success') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only delete this exact run's matching shard artifacts after one publisher succeeds.
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name] | @tsv' \
            | while read -r id name; do
                if [[ "$name" =~ ^full-${LANGUAGE}-[0-9]+$ ]]; then
                  gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
                  echo "Deleted published artifact $name ($id)"
                fi
              done
      - name: Missing publisher warning
        if: ${{ env.HF_TOKEN == '' || env.KAGGLE_TOKEN == '' }}
        shell: bash
        run: |
          [[ -n "$HF_TOKEN" ]] || echo "::warning::HF_TOKEN absent: HF publication skipped"
          [[ -n "$KAGGLE_TOKEN" ]] || echo "::warning::KAGGLE_TOKEN absent: Kaggle publication skipped"
