name: Rebuild Wikipedia shards

on:
  workflow_dispatch:
    inputs:
      language:
        description: Wikimedia project code (e.g. eswiki or zhwiki)
        required: true
        default: enwiki
        type: string
      kaggle_dataset:
        description: Optional Kaggle destination override
        required: false
        type: string
      hf_repo:
        description: Optional Hugging Face destination override
        required: false
        type: string
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      kaggle_dataset:
        required: false
        type: string
      hf_repo:
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    env:
      LANGUAGE: ${{ inputs.language }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LANGUAGE" =~ ^[a-z][a-z0-9_-]*wiki$ ]] || exit 1
          . config/datasets.env
          available="$(python scripts/download_page_ranges.py --base-url "https://dumps.wikimedia.org/$LANGUAGE/latest" --language "$LANGUAGE" --count-only)"
          count="$FULL_SHARD_COUNT"
          if (( available < count )); then count="$available"; fi
          (( count > 0 ))
          python - "$count" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          count = int(sys.argv[1])
          print(f"count={count}")
          print(f"shards={json.dumps(list(range(1, count + 1)))}")
          PY

  build:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LANGUAGE: ${{ inputs.language }}
      SHARD: ${{ matrix.shard }}
      COUNT: ${{ needs.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Install converter dependencies
        run: python -m pip install -r REQUIREMENTS.TXT
      - name: Download assigned page ranges
        shell: bash
        run: |
          set -euo pipefail
          python scripts/download_page_ranges.py \
            --base-url "https://dumps.wikimedia.org/$LANGUAGE/latest" \
            --language "$LANGUAGE" --shard "$((SHARD - 1))" \
            --shard-count "$COUNT" --output-dir ranges > ranges.txt
          test -s ranges.txt
      - name: Convert and validate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dumps < ranges.txt
          file="$(printf '%s_%02d_of_%02d.txt.gz' "$LANGUAGE" "$SHARD" "$COUNT")"
          python wiki_to_text.py "${dumps[@]}" output --output-name "$file"
          test -s "output/$file"
          gzip -t "output/$file"
      - name: Stage compressed shard
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ inputs.language }}-${{ matrix.shard }}
          path: output/*.txt.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Free runner disk
        if: always()
        run: rm -rf output ranges ranges.txt

  publish:
    needs: [plan, build]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LANGUAGE: ${{ inputs.language }}
      COUNT: ${{ needs.plan.outputs.count }}
      HF_REPO_INPUT: ${{ inputs.hf_repo }}
      KAGGLE_DATASET_INPUT: ${{ inputs.kaggle_dataset }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve language and publishing destinations
        shell: bash
        run: |
          set -euo pipefail
          . config/datasets.env
          code="${LANGUAGE%wiki}"
          hf_key="FULL_HF_REPO_${code^^}"
          kaggle_key="FULL_KAGGLE_DATASET_${code^^}"
          hf_id="$HF_REPO_INPUT"
          kaggle_id="$KAGGLE_DATASET_INPUT"
          if [[ -z "$hf_id" ]]; then hf_id="${!hf_key:-}"; fi
          if [[ -z "$kaggle_id" ]]; then kaggle_id="${!kaggle_key:-}"; fi
          case "$code" in
            en) name=English ;; es) name=Spanish ;; fr) name=French ;;
            de) name=German ;; it) name=Italian ;; pt) name=Portuguese ;;
            ru) name=Russian ;; zh) name=Chinese ;; no) name=Norwegian ;;
            *) name="$code" ;;
          esac
          echo "FULL_HF_REPO=$hf_id" >> "$GITHUB_ENV"
          echo "FULL_KAGGLE_DATASET=$kaggle_id" >> "$GITHUB_ENV"
          echo "LANG_CODE=$code" >> "$GITHUB_ENV"
          echo "LANG_NAME=$name" >> "$GITHUB_ENV"
          echo "SOURCE_REPO_URL=$SOURCE_REPO_URL" >> "$GITHUB_ENV"
          echo "UPSTREAM_REPO_URL=$UPSTREAM_REPO_URL" >> "$GITHUB_ENV"
          echo "HF=$hf_id Kaggle=$kaggle_id"
      - name: Collect built shards
        uses: actions/download-artifact@v4
        with:
          pattern: full-${{ inputs.language }}-*
          merge-multiple: true
          path: publish
      - name: Inspect available shards and write manifest
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          e = os.environ
          root = Path("publish")
          root.mkdir(exist_ok=True)
          expected = int(e["COUNT"])
          pattern = re.compile(r"^" + re.escape(e["LANGUAGE"]) + rf"_(\d{{2}})_of_{expected:02d}\.txt\.gz$")
          present = set()
          for file in sorted(root.glob("*.txt.gz")):
              match = pattern.fullmatch(file.name)
              if match is None or int(match.group(1)) not in range(1, expected + 1):
                  print(f"::warning::Ignoring unexpected artifact {file.name}", flush=True)
                  file.unlink()
                  continue
              try:
                  with gzip.open(file, "rb") as stream:
                      while stream.read(8 * 1024 * 1024):
                          pass
              except (OSError, EOFError) as exc:
                  print(f"::warning::Discarding corrupt shard {file.name}: {exc}", flush=True)
                  file.unlink()
                  continue
              present.add(int(match.group(1)))

          present = sorted(present)
          missing = sorted(set(range(1, expected + 1)) - set(present))
          manifest = {
              "language": e["LANGUAGE"],
              "build_run": e["GITHUB_RUN_ID"],
              "generated_utc": datetime.now(timezone.utc).isoformat(),
              "expected_shards": expected,
              "published_shards": len(present),
              "present_shards": present,
              "missing_shards": missing,
              "complete": not missing,
          }
          (root / "build-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          with open(e["GITHUB_OUTPUT"], "a") as output:
              print(f"available={'true' if present else 'false'}", file=output)
              print(f"complete={'true' if not missing else 'false'}", file=output)
          summary = (f"{e['LANGUAGE']}: {len(present)}/{expected} valid shards. "
                     f"Missing: {missing if missing else 'none'}.")
          print(summary, flush=True)
          with open(e["GITHUB_STEP_SUMMARY"], "a") as output:
              print(summary, file=output)
          if not present:
              print("::warning::No valid shard artifacts to publish", flush=True)
          PY
      - name: Publish to Hugging Face
        id: hf_publish
        continue-on-error: true
        if: ${{ steps.inspect.outputs.available == 'true' && env.HF_TOKEN != '' && env.FULL_HF_REPO != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install huggingface_hub
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          import json
          e = os.environ
          api = HfApi(token=e["HF_TOKEN"])
          repo = e["FULL_HF_REPO"]
          api.create_repo(repo_id=repo, repo_type="dataset", exist_ok=True)
          card = Path("config/hf-dataset-card.md").read_text()
          replacements = {
              "__LANG_PROJECT__": e["LANGUAGE"],
              "__LANG_CODE__": e["LANG_CODE"],
              "__LANG_NAME__": e["LANG_NAME"],
              "__HF_REPO__": repo,
              "__SOURCE_URL__": f'https://dumps.wikimedia.org/{e["LANGUAGE"]}/latest',
              "__REPO_URL__": e["SOURCE_REPO_URL"],
              "__UPSTREAM_URL__": e["UPSTREAM_REPO_URL"],
          }
          for token, value in replacements.items():
              card = card.replace(token, value)
          manifest = json.loads(Path("publish/build-manifest.json").read_text())
          n = manifest["published_shards"]
          expected = manifest["expected_shards"]
          missing = manifest["missing_shards"]
          status = ("COMPLETE" if manifest["complete"] else "PARTIAL")
          warning = (f"**Build status: {status} — {n}/{expected} shards.** "
                     + (f"Missing shard numbers: {missing}. The dataset is incomplete."
                        if missing else "All planned shards are present.")
                     + "\n\n")
          card = card.replace("## Format", warning + "## Format", 1)
          Path("publish/README.md").write_text(card, encoding="utf-8")
          api.upload_folder(repo_id=repo, repo_type="dataset",
                            folder_path="publish", path_in_repo="data",
                            allow_patterns=["*.txt.gz", "build-manifest.json"],
                            delete_patterns="*.txt.gz",
                            commit_message=f'Rebuild {e["LANG_NAME"]} Wikipedia shards ({n}/{expected})')
          api.upload_file(repo_id=repo, repo_type="dataset",
                          path_or_fileobj="publish/README.md", path_in_repo="README.md",
                          commit_message=f'Update {e["LANG_NAME"]} dataset card')
          print(f"https://huggingface.co/datasets/{repo}")
          PY
      - name: Publish to Kaggle
        id: kaggle_publish
        continue-on-error: true
        if: ${{ always() && steps.inspect.outputs.available == 'true' && env.KAGGLE_TOKEN != '' && env.FULL_KAGGLE_DATASET != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install kaggle
          if [[ "$KAGGLE_TOKEN" == \{* ]]; then
            mkdir -p "$HOME/.kaggle"
            printf '%s' "$KAGGLE_TOKEN" > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
          else
            export KAGGLE_API_TOKEN="$KAGGLE_TOKEN"
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          e = os.environ
          meta = json.loads(Path("kaggle-metadata-full.json").read_text())
          meta["id"] = e["FULL_KAGGLE_DATASET"]
          meta["title"] = f'Plaintext Wikipedia ({e["LANG_NAME"]})'
          meta["description"] = meta["description"].replace("English", e["LANG_NAME"])
          meta["description"] = meta["description"].replace("__REPO_URL__", e["SOURCE_REPO_URL"])
          meta["description"] = meta["description"].replace("__UPSTREAM_URL__", e["UPSTREAM_REPO_URL"])
          manifest = json.loads(Path("publish/build-manifest.json").read_text())
          n, expected = manifest["published_shards"], manifest["expected_shards"]
          meta["description"] += (
              f"\n\nBuild status: {'complete' if manifest['complete'] else 'PARTIAL'} "
              f"({n}/{expected} shards). "
              f"Missing shard numbers: {manifest['missing_shards']}. "
              "See build-manifest.json for exact coverage."
          )
          Path("publish/dataset-metadata.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2))
          PY
          if kaggle datasets files -d "$FULL_KAGGLE_DATASET" >/dev/null 2>&1; then
            kaggle datasets version -p publish -m "Rebuild $LANG_NAME Wikipedia $(date -u +%F)" --dir-mode skip
          else
            kaggle datasets create -p publish --public --dir-mode skip
          fi
          echo "https://www.kaggle.com/datasets/$FULL_KAGGLE_DATASET"
      - name: Report publishing errors
        if: ${{ always() && steps.inspect.outputs.available == 'true' }}
        shell: bash
        env:
          HF_RESULT: ${{ steps.hf_publish.outcome }}
          KAGGLE_RESULT: ${{ steps.kaggle_publish.outcome }}
        run: |
          echo "HF publication: $HF_RESULT; Kaggle publication: $KAGGLE_RESULT"
          if [[ "$HF_RESULT" == failure || "$KAGGLE_RESULT" == failure ]]; then
            echo "::error::At least one publishing destination failed"
            exit 1
          fi
      - name: Missing publisher warning
        if: ${{ env.HF_TOKEN == '' || env.KAGGLE_TOKEN == '' }}
        shell: bash
        run: |
          [[ -n "$HF_TOKEN" ]] || echo "::warning::HF_TOKEN absent: HF publication skipped"
          [[ -n "$KAGGLE_TOKEN" ]] || echo "::warning::KAGGLE_TOKEN absent: Kaggle publication skipped"
