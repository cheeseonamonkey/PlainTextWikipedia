name: Rebuild Wikipedia shards

on:
  workflow_dispatch:
    inputs:
      language:
        description: Wikimedia project code (e.g. eswiki or zhwiki)
        required: true
        default: enwiki
        type: string
      kaggle_dataset:
        description: Optional Kaggle destination override
        required: false
        type: string
      hf_repo:
        description: Optional Hugging Face destination override
        required: false
        type: string
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      kaggle_dataset:
        required: false
        type: string
      hf_repo:
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      mode: ${{ steps.plan.outputs.mode }}
      archive_bytes: ${{ steps.plan.outputs.archive_bytes }}
      snapshot: ${{ steps.plan.outputs.snapshot }}
    env:
      LANGUAGE: ${{ inputs.language }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LANGUAGE" =~ ^[a-z][a-z0-9_-]*wiki$ ]] || exit 1
          . config/datasets.env
          max_shards="$WIKIPEDIA_SHARD_TARGET"
          [[ "$max_shards" == 8 ]] || { echo "::error::Expected eight output shards"; exit 1; }
          plan="$(python scripts/multistream_shards.py plan \
            --base-url "https://dumps.wikimedia.org/$LANGUAGE/latest" \
            --language "$LANGUAGE" --max-shards "$max_shards")"
          python - "$plan" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          p=json.loads(sys.argv[1])
          n=int(p["count"])
          assert 1<=n<=64
          print(f"count={n}")
          print(f"shards={json.dumps(list(range(1,n+1)))}")
          print(f"mode={p['mode']}")
          print(f"archive_bytes={p['archive_bytes']}")
          print(f"snapshot={p.get('snapshot','')}")
          print(f"::notice::Wikipedia source: {p['reason']}, {n} planned shard jobs",
                file=sys.stderr)
          PY

  build:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LANGUAGE: ${{ inputs.language }}
      SHARD: ${{ matrix.shard }}
      COUNT: ${{ needs.plan.outputs.count }}
      MODE: ${{ needs.plan.outputs.mode }}
      ARCHIVE_BYTES: ${{ needs.plan.outputs.archive_bytes }}
      SNAPSHOT: ${{ needs.plan.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v4
      - name: Install converter dependencies
        run: python -m pip install -r REQUIREMENTS.TXT
      - name: Download assigned page ranges
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == "indexed" ]]; then
            python scripts/multistream_shards.py fetch \
              --base-url "https://dumps.wikimedia.org/$LANGUAGE/latest" \
              --language "$LANGUAGE" --shard "$((SHARD - 1))" \
              --count "$COUNT" --expected-size "$ARCHIVE_BYTES" \
              --output-dir ranges > ranges.txt
            printf '[]\n' > download-failures.json
          elif [[ "$MODE" == "current_export" ]]; then
            python scripts/current_export.py fetch \
              --language "$LANGUAGE" --shard "$((SHARD - 1))" \
              --count "$COUNT" --snapshot "$SNAPSHOT" \
              --output-dir ranges --failures-file download-failures.json > ranges.txt
          else
            python scripts/download_page_ranges.py \
              --base-url "https://dumps.wikimedia.org/$LANGUAGE/latest" \
              --language "$LANGUAGE" --shard "$((SHARD - 1))" \
              --shard-count "$COUNT" --output-dir ranges \
              --allow-partial --failures-file download-failures.json > ranges.txt
          fi
          test -s ranges.txt
      - name: Convert with recursive a/b splitting on failure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/convert_adaptive.py \
            --language "$LANGUAGE" --shard "$SHARD" --count "$COUNT" \
            --ranges-file ranges.txt --failures-file download-failures.json \
            --max-depth 3 --max-seconds 19000 --output-dir output
      - name: Stage successful leaves and split manifest even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ inputs.language }}-${{ matrix.shard }}
          path: |
            output/*.txt.gz
            output/*.manifest.json
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
      - name: Free runner disk
        if: always()
        run: rm -rf output ranges ranges.txt download-failures.json

  publish:
    needs: [plan, build]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    uses: ./.github/workflows/publish-wikipedia.yml
    with:
      language: ${{ inputs.language }}
      count: ${{ needs.plan.outputs.count }}
      hf_repo: ${{ inputs.hf_repo }}
      kaggle_dataset: ${{ inputs.kaggle_dataset }}
    secrets: inherit
