name: Rebuild Wikipedia shards

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Wikipedia project code (for example enwiki, frwiki, dewiki)"
        required: true
        default: enwiki
        type: string
      kaggle_dataset:
        description: "Kaggle dataset ID (owner/dataset); leave blank to skip Kaggle publishing"
        required: false
        type: string
      hf_repo:
        description: "Hugging Face dataset repo ID; leave blank to skip HF publishing"
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          count="$(sed -n 's/^FULL_SHARD_COUNT=//p' config/datasets.env)"
          python - "$count" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          count = int(sys.argv[1])
          print(f"shards={json.dumps(list(range(1, count + 1)))}")
          PY

  build:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LANGUAGE: ${{ inputs.language }}
      HF_REPO_INPUT: ${{ inputs.hf_repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Load dataset configuration
        run: |
          set -a
          . config/datasets.env
          set +a
          if [[ ! "$LANGUAGE" =~ ^[a-z0-9_-]+wiki$ ]]; then
            echo "Invalid Wikimedia project code: $LANGUAGE" >&2
            exit 1
          fi
          echo "FULL_LANGUAGE=$LANGUAGE" >> "$GITHUB_ENV"
          echo "FULL_SOURCE_BASE_URL=https://dumps.wikimedia.org/$LANGUAGE/latest" >> "$GITHUB_ENV"
          if [[ -n "$HF_REPO_INPUT" ]]; then
            hf_repo="$HF_REPO_INPUT"
          elif [[ "$LANGUAGE" == "enwiki" ]]; then
            hf_repo="$FULL_HF_REPO"
          else
            hf_repo=""
          fi
          echo "FULL_HF_REPO=$hf_repo" >> "$GITHUB_ENV"
          echo "FULL_SHARD_COUNT=$FULL_SHARD_COUNT" >> "$GITHUB_ENV"
          echo "SHARD_NUMBER=${{ matrix.shard }}" >> "$GITHUB_ENV"

      - name: Install converter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r REQUIREMENTS.TXT huggingface_hub

      - name: Download page-range files for the shard
        run: |
          python scripts/download_page_ranges.py             --base-url "$FULL_SOURCE_BASE_URL"             --language "$FULL_LANGUAGE"             --shard "$((SHARD_NUMBER - 1))"             --shard-count "$FULL_SHARD_COUNT"             --output-dir ranges > ranges.txt
          test -s ranges.txt

      - name: Convert the shard
        run: |
          mapfile -t dumps < ranges.txt
          file="${FULL_LANGUAGE}_$(printf '%02d' "$SHARD_NUMBER")_of_$(printf '%02d' "$FULL_SHARD_COUNT").txt.gz"
          python wiki_to_text.py "${dumps[@]}" output --output-name "$file"
          test -s "output/$file"
          gzip -t "output/$file"

      - name: Publish shard to Hugging Face
        if: ${{ env.HF_TOKEN != '' && env.FULL_HF_REPO != '' }}
        run: |
          file="${FULL_LANGUAGE}_$(printf '%02d' "$SHARD_NUMBER")_of_$(printf '%02d' "$FULL_SHARD_COUNT").txt.gz"
          hf upload "$FULL_HF_REPO" "output/$file" "data/$file"             --repo-type dataset --token "$HF_TOKEN"             --commit-message "Rebuild $FULL_LANGUAGE Wikipedia shard $SHARD_NUMBER/$FULL_SHARD_COUNT ($(date -u +%Y-%m-%d))"

      - name: Stage shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ inputs.language }}-shard-${{ matrix.shard }}
          path: output/${{ inputs.language }}_*.txt.gz
          retention-days: 3

  publish-kaggle:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      KAGGLE_DATASET_INPUT: ${{ inputs.kaggle_dataset }}
      LANGUAGE: ${{ inputs.language }}
    steps:
      - uses: actions/checkout@v4

      - name: Load dataset configuration
        run: |
          set -a
          . config/datasets.env
          set +a
          if [[ ! "$LANGUAGE" =~ ^[a-z0-9_-]+wiki$ ]]; then
            echo "Invalid Wikimedia project code: $LANGUAGE" >&2
            exit 1
          fi
          if [[ -n "$KAGGLE_DATASET_INPUT" ]]; then
            kaggle_dataset="$KAGGLE_DATASET_INPUT"
          elif [[ "$LANGUAGE" == "enwiki" ]]; then
            kaggle_dataset="$FULL_KAGGLE_DATASET"
          else
            kaggle_dataset=""
          fi
          echo "FULL_KAGGLE_DATASET=$kaggle_dataset" >> "$GITHUB_ENV"
          echo "FULL_SHARD_COUNT=$FULL_SHARD_COUNT" >> "$GITHUB_ENV"
          echo "FULL_LANGUAGE=$LANGUAGE" >> "$GITHUB_ENV"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Download generated shards
        uses: actions/download-artifact@v4
        with:
          pattern: full-${{ inputs.language }}-shard-*
          merge-multiple: true
          path: publish

      - name: Validate all shards
        run: |
          test "$(find publish -maxdepth 1 -name "${FULL_LANGUAGE}_*_of_*.txt.gz" | wc -l)" -eq "$FULL_SHARD_COUNT"
          for file in publish/${FULL_LANGUAGE}_*.txt.gz; do gzip -t "$file"; done

      - name: Configure Kaggle credentials
        if: ${{ env.KAGGLE_TOKEN != '' && env.FULL_KAGGLE_DATASET != '' }}
        run: echo "KAGGLE_API_TOKEN=$KAGGLE_TOKEN" >> "$GITHUB_ENV"

      - name: Publish complete dataset to Kaggle
        if: ${{ env.KAGGLE_TOKEN != '' && env.FULL_KAGGLE_DATASET != '' }}
        run: |
          mkdir -p current
          kaggle datasets download -d "$FULL_KAGGLE_DATASET" -p current --unzip || true
          cp publish/${FULL_LANGUAGE}_*.txt.gz current/
          cp kaggle-metadata-full.json current/dataset-metadata.json
          sed -i "s#ffatty/plaintext-wikipedia-full-english#$FULL_KAGGLE_DATASET#; s/English/$FULL_LANGUAGE/g" current/dataset-metadata.json
          kaggle datasets version -p current             -m "Complete $FULL_LANGUAGE Wikipedia rebuild ($(date -u +%Y-%m-%d))" --dir-mode zip
