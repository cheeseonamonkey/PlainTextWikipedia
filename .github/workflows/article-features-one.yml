name: Build complete Wikipedia bundle
on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: Existing Wikipedia dataset repository
        type: string
        required: true
        default: ffatty/plaintext-wikipedia-full-english
      bundle_run_id:
        description: Resume the retained bundle from this prior run ID (no feature rebuild)
        type: string
        default: ''
      publish:
        description: Publish identical complete bundle to ALL three targets
        type: boolean
        default: false
  workflow_call:
    inputs:
      bundle_run_id:
        type: string
        default: ''
      repo_id:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      source_run_id:
        type: string
        default: ''
      language:
        type: string
        default: ''
    secrets:
      HF_TOKEN:
        required: true
      KAGGLE_TOKEN:
        required: false
      ZENODO_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: wikipedia-bundle-${{ inputs.repo_id }}
      cancel-in-progress: false
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      REPO: ${{ inputs.repo_id }}
      LANGUAGE: ${{ inputs.language }}
      PUBLISH: ${{ inputs.publish }}
      BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve bundle identity and resume inputs
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BUNDLE_RUN_ID" && -n "$SOURCE_RUN_ID" ]]; then
            echo "::error::Choose converted sources or a retained bundle, not both"
            exit 1
          fi
          echo "name=${REPO##*/}" >> "$GITHUB_OUTPUT"
      - name: Restore retained complete bundle
        if: inputs.bundle_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          name: ${{ steps.artifact.outputs.name }}
          path: release
      - name: Install CPU dependencies
        run: |
          python -m pip install --no-index --find-links vendor/wheels -r requirements-encoder.txt
      - name: Check all publisher credentials before building
        if: inputs.publish
        run: python -m scripts.publish_preflight
      - name: Sanity-check bundle imports and real CPU Bekko inference
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.wikipedia_bundle --help >/dev/null
          python - <<'PY'
          import gzip
          import tempfile
          from pathlib import Path
          from scripts.wikipedia_bundle import links, make_bundle
          from scripts.bundle_artifacts import verify_bundle

          with tempfile.TemporaryDirectory(prefix="wiki-smoke-") as tmp:
              root = Path(tmp)
              source = root / "smoke.txt.gz"
              articles = (
                  ("Orion", "Orion constellation includes bright stars and nebulae."),
                  ("Pacific", "Ocean currents move seawater along continental shores."),
                  ("Calculus", "Calculus studies rates of change and mathematical functions."),
              )
              with gzip.open(source, "wt", encoding="utf-8") as output:
                  for title, body in articles:
                      output.write(f"{title}\n{body}\n\n")
              release = root / "bundle"
              make_bundle([source], release, "en",
                          links("ffatty/plaintext-wikipedia-full-english"), {"smoke": True})
              if verify_bundle(release)["documents"] != len(articles):
                  raise RuntimeError("Miniature bundle dropped articles")
              print("Real CPU encoder and full miniature bundle passed", flush=True)
          PY
          df -h .
      - name: Collect complete converted source artifacts
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: full-${{ inputs.language }}-*
          merge-multiple: true
          path: sources
      - name: Validate converted source coverage
        if: inputs.source_run_id != ''
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from scripts.inspect_adaptive import inspect
          reports = [json.loads(p.read_text()) for p in Path('sources').glob('*.manifest.json')]
          counts = {r['planned_shards'] for r in reports}
          if len(counts) != 1 or any(r['language'] != os.environ['LANGUAGE'] for r in reports):
              raise RuntimeError('Missing/inconsistent source manifests')
          if not inspect(os.environ['LANGUAGE'], counts.pop(), Path('sources'))['complete']:
              raise RuntimeError('Incomplete edition; nothing will be published')
          PYCODE
      - name: Build and verify everything, then optionally publish
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --output release)
          if [[ -d sources ]]; then args+=(--sources sources); fi
          if [[ -n "$BUNDLE_RUN_ID" ]]; then args+=(--resume); fi
          if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
          python -m scripts.wikipedia_bundle "${args[@]}"
      - name: Retain verified bundle for inspection
        if: failure() || !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release/*
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
