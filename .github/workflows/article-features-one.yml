name: Publish one Wikipedia article-feature dataset

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: Existing Hugging Face Wikipedia dataset (ffatty/...)
        type: string
        required: true
        default: ffatty/plain-text-wikipedia-simpleenglish
      publish:
        description: Publish to existing Hugging Face dataset
        type: boolean
        default: true
      fts5:
        description: Build optional SQLite FTS5 full-text search index
        type: boolean
        default: true
      allow_lexical_only:
        description: Diagnostic only; refuse missing fastText by default
        type: boolean
        default: false
  workflow_call:
    inputs:
      repo_id:
        type: string
        required: true
      publish:
        type: boolean
        default: true
      fts5:
        type: boolean
        default: true
      allow_lexical_only:
        type: boolean
        default: false
    secrets:
      HF_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: wiki-features-${{ inputs.repo_id }}
      cancel-in-progress: false
    env:
      REPO: ${{ inputs.repo_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WANT_PUBLISH: ${{ inputs.publish }}
      WANT_FTS: ${{ inputs.fts5 }}
      ALLOW_LEXICAL: ${{ inputs.allow_lexical_only }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir huggingface_hub numpy zstandard fasttext-wheel stopwordsiso==0.7.1 regex pyarrow vaderSentiment textstat
          python -m pip install --disable-pip-version-check --no-cache-dir 'sentence-transformers[openvino]>=5.0' 'transformers>=4.57,<5'
      - name: Build complete article Parquet and corpus-level data
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --vocab 10000 --tfidf 5000
                --train-token-cap 2000000 --sample-mod 4
                --fasttext-timeout 180 --threads 2)
          if [[ "$WANT_PUBLISH" == true ]]; then args+=(--publish); fi
          if [[ "$WANT_FTS" != true ]]; then args+=(--no-fts5); fi
          if [[ "$ALLOW_LEXICAL" == true ]]; then args+=(--allow-lexical-only); fi
          SECONDS=0
          trap 'echo "- Feature phase: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"' EXIT
          python scripts/article_features_release.py "${args[@]}"
