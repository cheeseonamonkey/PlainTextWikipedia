name: Build complete Wikipedia bundle
on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: Existing Wikipedia dataset repository
        type: string
        required: true
      bundle_run_id:
        description: Resume the retained bundle from this prior run ID (no feature rebuild)
        type: string
        default: ''
      publish:
        description: Publish identical complete bundle to ALL three targets
        type: boolean
        default: false
  workflow_call:
    inputs:
      bundle_run_id:
        type: string
        default: ''
      repo_id:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      source_run_id:
        type: string
        default: ''
      language:
        type: string
        default: ''
    secrets:
      HF_TOKEN:
        required: true
      KAGGLE_TOKEN:
        required: false
      ZENODO_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: wikipedia-bundle-${{ inputs.repo_id }}
      cancel-in-progress: false
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      REPO: ${{ inputs.repo_id }}
      LANGUAGE: ${{ inputs.language }}
      PUBLISH: ${{ inputs.publish }}
      BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve bundle identity and resume inputs
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BUNDLE_RUN_ID" && -n "$SOURCE_RUN_ID" ]]; then
            echo "::error::Choose converted sources or a retained bundle, not both"
            exit 1
          fi
          echo "name=${REPO##*/}" >> "$GITHUB_OUTPUT"
      - name: Restore retained complete bundle
        if: inputs.bundle_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          name: ${{ steps.artifact.outputs.name }}
          path: release
      - name: Install CPU dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub numpy zstandard fasttext-wheel stopwordsiso==0.7.1 regex pyarrow pyyaml kaggle six requests
          python -m pip install --no-cache-dir 'sentence-transformers[openvino]>=5.0' 'transformers>=5.12'
      - name: Check all publisher credentials before building
        if: inputs.publish
        run: python -m scripts.publish_preflight
      - name: Collect complete converted source artifacts
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: full-${{ inputs.language }}-*
          merge-multiple: true
          path: sources
      - name: Validate converted source coverage
        if: inputs.source_run_id != ''
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from scripts.inspect_adaptive import inspect
          reports = [json.loads(p.read_text()) for p in Path('sources').glob('*.manifest.json')]
          counts = {r['planned_shards'] for r in reports}
          if len(counts) != 1 or any(r['language'] != os.environ['LANGUAGE'] for r in reports):
              raise RuntimeError('Missing/inconsistent source manifests')
          if not inspect(os.environ['LANGUAGE'], counts.pop(), Path('sources'))['complete']:
              raise RuntimeError('Incomplete edition; nothing will be published')
          PYCODE
      - name: Build and verify everything, then optionally publish
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --output release)
          if [[ -d sources ]]; then args+=(--sources sources); fi
          if [[ -n "$BUNDLE_RUN_ID" ]]; then args+=(--resume); fi
          if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
          python -m scripts.wikipedia_bundle "${args[@]}"
      - name: Retain verified bundle for inspection
        if: failure() || !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release/*
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
