name: Refresh one English Wikipedia shard

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "1-based shard number; blank uses the current UTC month"
        required: false
        type: string
  schedule:
    - cron: "0 7 1 * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Load dataset configuration
        run: |
          set -a
          . config/datasets.env
          set +a
          for name in FULL_LANGUAGE FULL_SOURCE_BASE_URL FULL_KAGGLE_DATASET FULL_HF_REPO FULL_SHARD_COUNT; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      - name: Select monthly shard
        env:
          REQUESTED_SHARD: ${{ inputs.shard }}
        run: |
          if [ -n "$REQUESTED_SHARD" ]; then
            shard="$REQUESTED_SHARD"
          else
            shard="$((10#$(date -u +%m) - 1))"
            shard="$((shard % FULL_SHARD_COUNT + 1))"
          fi
          test "$shard" -ge 1
          test "$shard" -le "$FULL_SHARD_COUNT"
          echo "SHARD_NUMBER=$shard" >> "$GITHUB_ENV"
          echo "Selected shard $shard/$FULL_SHARD_COUNT"

      - name: Install converter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r REQUIREMENTS.TXT kaggle six huggingface_hub

      - name: Download page-range files for the shard
        run: |
          python scripts/download_page_ranges.py             --base-url "$FULL_SOURCE_BASE_URL"             --language "$FULL_LANGUAGE"             --shard "$((SHARD_NUMBER - 1))"             --shard-count "$FULL_SHARD_COUNT"             --output-dir ranges > ranges.txt
          test -s ranges.txt

      - name: Convert the shard
        run: |
          mapfile -t dumps < ranges.txt
          python wiki_to_text.py "${dumps[@]}" output             --output-name "enwiki_$(printf '%02d' "$SHARD_NUMBER")_of_$(printf '%02d' "$FULL_SHARD_COUNT").txt.gz"

      - name: Validate output
        run: |
          file="output/enwiki_$(printf '%02d' "$SHARD_NUMBER")_of_$(printf '%02d' "$FULL_SHARD_COUNT").txt.gz"
          test -s "$file"
          gzip -t "$file"
          test "$(gzip -cd "$file" | wc -l)" -gt 0

      - name: Publish refreshed shard to Hugging Face first
        if: ${{ env.HF_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          file="enwiki_$(printf '%02d' "$SHARD_NUMBER")_of_$(printf '%02d' "$FULL_SHARD_COUNT").txt.gz"
          hf upload "$FULL_HF_REPO" "output/$file" "data/$file" \
            --repo-type dataset --token "$HF_TOKEN" \
            --commit-message "Refresh English Wikipedia shard $SHARD_NUMBER/$FULL_SHARD_COUNT ($(date -u +%Y-%m-%d))"

      - name: Check Kaggle CLI credentials before downloading its full dataset
        id: kaggle
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KAGGLE_TOKEN" ]] && python scripts/kaggle_auth.py --owner ffatty; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Kaggle not available; Hugging Face refresh remains valid"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish complete existing Kaggle version (never replace with one shard)
        if: ${{ steps.kaggle.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current
          kaggle datasets download -d "$FULL_KAGGLE_DATASET" -p current --unzip
          file="enwiki_$(printf '%02d' "$SHARD_NUMBER")_of_$(printf '%02d' "$FULL_SHARD_COUNT").txt.gz"
          cp "output/$file" current/
          cp kaggle-metadata-full.json current/dataset-metadata.json
          sed -i "s#ffatty/plaintext-wikipedia-full-english#$FULL_KAGGLE_DATASET#" current/dataset-metadata.json
          kaggle datasets version -p current \
            -m "Refresh English Wikipedia shard $SHARD_NUMBER/$FULL_SHARD_COUNT ($(date -u +%Y-%m-%d))" \
            --dir-mode zip --keep-tabular

      - name: Free runner disk
        if: always()
        run: |
          rm -rf output current
