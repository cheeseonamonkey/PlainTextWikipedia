name: Rebuild complete Simple English dataset

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Load dataset configuration
        run: |
          set -a
          . config/datasets.env
          set +a
          for name in SIMPLE_SOURCE_URL SIMPLE_KAGGLE_DATASET SIMPLE_HF_REPO SIMPLE_SHARD_COUNT; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          echo "SOURCE_REPO_URL=$SOURCE_REPO_URL" >> "$GITHUB_ENV"
          echo "UPSTREAM_REPO_URL=$UPSTREAM_REPO_URL" >> "$GITHUB_ENV"

      - name: Install converter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r REQUIREMENTS.TXT kaggle huggingface_hub

      - name: Download current Simple English dump
        run: |
          curl --fail --location --retry 4 --retry-delay 10             --output simplewiki.xml.bz2 "$SIMPLE_SOURCE_URL"

      - name: Rebuild complete compressed dataset
        run: python wiki_to_text.py simplewiki.xml.bz2 output --prefix simplewiki --shards "$SIMPLE_SHARD_COUNT"

      - name: Validate complete output
        run: |
          test -s output/simplewiki_01_of_01.txt.gz
          gzip -t output/simplewiki_01_of_01.txt.gz
          articles="$(gzip -cd output/simplewiki_01_of_01.txt.gz | awk 'BEGIN { RS=""; count=0 } { count++ } END { print count }')"
          test "$articles" -gt 1000
          echo "Validated $articles articles"

      - name: Configure Kaggle credentials
        if: ${{ env.KAGGLE_TOKEN != '' }}
        run: echo "KAGGLE_API_TOKEN=$KAGGLE_TOKEN" >> "$GITHUB_ENV"

      - name: Publish to Kaggle
        if: ${{ env.KAGGLE_TOKEN != '' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e = os.environ
          meta = json.loads(Path("kaggle-metadata.json").read_text())
          meta["id"] = e["SIMPLE_KAGGLE_DATASET"]
          meta["description"] = meta["description"].replace("__REPO_URL__", e["SOURCE_REPO_URL"])
          meta["description"] = meta["description"].replace("__UPSTREAM_URL__", e["UPSTREAM_REPO_URL"])
          Path("output/dataset-metadata.json").write_text(json.dumps(meta, indent=2))
          PY
          if kaggle datasets files -d "$SIMPLE_KAGGLE_DATASET" >/dev/null 2>&1; then
            kaggle datasets version -p output -m "Complete Simple English rebuild ($(date -u +%F))" --dir-mode skip
          else
            kaggle datasets create -p output --public --dir-mode skip
          fi

      - name: Publish to Hugging Face
        if: ${{ env.HF_TOKEN != '' }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          e = os.environ
          HfApi(token=e["HF_TOKEN"]).create_repo(
              repo_id=e["SIMPLE_HF_REPO"], repo_type="dataset", exist_ok=True)
          PY
          hf upload "$SIMPLE_HF_REPO" output             --repo-type dataset --token "$HF_TOKEN" --path-in-repo data             --commit-message "Complete Simple English rebuild ($(date -u +%Y-%m-%d))"

      - name: Publish provenance card to Hugging Face
        if: ${{ env.HF_TOKEN != '' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          e = os.environ
          s = Path("config/hf-dataset-card.md").read_text()
          for key, value in {
              "__LANG_PROJECT__": "simplewiki",
              "__LANG_NAME__": "Simple English",
              "__LANG_CODE__": "simple",
              "__HF_REPO__": e["SIMPLE_HF_REPO"],
              "__SOURCE_URL__": e["SIMPLE_SOURCE_URL"],
              "__REPO_URL__": e["SOURCE_REPO_URL"],
              "__UPSTREAM_URL__": e["UPSTREAM_REPO_URL"],
          }.items():
              s = s.replace(key, value)
          Path("README.md").write_text(s)
          PY
          hf upload "$SIMPLE_HF_REPO" README.md README.md             --repo-type dataset --token "$HF_TOKEN"             --commit-message "Credit source repositories for Simple English Wikipedia"

      - name: Free runner disk
        if: always()
        run: |
          rm -rf output
