name: Rebuild complete Simple English dataset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install converter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r REQUIREMENTS.TXT

      - name: Download current Simple English dump
        run: |
          curl --fail --location --retry 4 --retry-delay 10 \
            --output simplewiki.xml.bz2 \
            https://dumps.wikimedia.org/simplewiki/latest/simplewiki-latest-pages-articles-multistream.xml.bz2

      - name: Rebuild complete compressed dataset
        run: python wiki_to_text.py simplewiki.xml.bz2 output --prefix simplewiki

      - name: Validate complete output
        run: |
          test -s output/simplewiki_01_of_01.txt.gz
          gzip -t output/simplewiki_01_of_01.txt.gz
          articles="$(gzip -cd output/simplewiki_01_of_01.txt.gz | awk 'BEGIN { RS=""; count=0 } { count++ } END { print count }')"
          test "$articles" -gt 1000
          echo "Validated $articles articles"

      - name: Configure Kaggle credentials
        if: ${{ secrets.KAGGLE_JSON != '' }}
        run: |
          mkdir -p "$HOME/.kaggle"
          printf '%s' '${{ secrets.KAGGLE_JSON }}' > "$HOME/.kaggle/kaggle.json"
          chmod 600 "$HOME/.kaggle/kaggle.json"

      - name: Publish to Kaggle
        if: ${{ secrets.KAGGLE_JSON != '' }}
        run: |
          cp kaggle-metadata.json output/dataset-metadata.json
          kaggle datasets version -p output --dataset-metadata output/dataset-metadata.json \
            -m "Complete Simple English rebuild ($(date -u +%Y-%m-%d))" --dir-mode zip

      - name: Publish to Hugging Face
        if: ${{ secrets.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          hf upload ffatty/plain-text-wikipedia-simpleenglish output \
            --repo-type dataset --token "$HF_TOKEN" --path-in-repo data \
            --commit-message "Complete Simple English rebuild ($(date -u +%Y-%m-%d))"
