name: Remove obsolete September ranges from current HF datasets
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-obsolete-hf-shards.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-stale:
    name: Exclude 3 obsolete overlapping Wikipedia shards
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Install Hugging Face API
        run: python -m pip install huggingface_hub
      - name: Remove only confirmed obsolete shards from HEAD
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          # These three output shards contain ONLY September dump page-ranges.
          # Their October counterparts already exist in a different shard.
          # HF git history retains the old files at their previous revisions.
          invalid = {
              "ffatty/plaintext-wikipedia-full-norwegian": "data/nowiki_02_of_03.txt.gz",
              "ffatty/plaintext-wikipedia-full-spanish": "data/eswiki_10_of_10.txt.gz",
              "ffatty/plaintext-wikipedia-full-chinese": "data/zhwiki_10_of_10.txt.gz",
          }
          for repo, path in invalid.items():
              files = api.list_repo_files(repo, repo_type="dataset")
              if path not in files:
                  print("Already excluded:", repo, path, flush=True)
                  continue
              # Require the other latest-edition shards to be present before
              # modifying any public dataset.
              prefix = path.split("/")[-1].split("_")[0]
              others = [x for x in files if x.startswith("data/" + prefix + "_")
                        and x.endswith(".txt.gz") and x != path]
              required = 2 if prefix == "nowiki" else 9
              if len(others) < required:
                  raise RuntimeError(f"Refusing deletion: {repo} has only {len(others)} other current-shard files, need {required}")
              api.delete_file(repo_id=repo, repo_type="dataset",
                              path_in_repo=path,
                              commit_message=f"Exclude overlapping September dump range: {path}")
              print(f"REMOVED outdated HEAD file {repo}/{path}; previous git revision retains it", flush=True)
          PY
