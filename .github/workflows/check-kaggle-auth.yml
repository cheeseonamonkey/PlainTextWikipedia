name: Check Kaggle publishing credentials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-kaggle-auth.yml
      - scripts/kaggle_auth.py

permissions:
  contents: read

jobs:
  credential-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Diagnose isolated CLI authentication and protected REST endpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.diagnose_kaggle_auth
      - name: Verify Kaggle credential mode without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/kaggle_auth.py --owner ffatty
      - name: Verify Kaggle credentials persist into a NEW shell step
        shell: bash
        run: |
          set -euo pipefail
          # The credential selector has already verified and propagated the
          # chosen mode. The raw GitHub secret is NOT a Kaggle CLI variable.
          unset KAGGLE_TOKEN
          # Report exit codes without printing API keys or dataset payloads.
          set +e
          kaggle datasets list --mine >/dev/null 2>/dev/null
          cli_list=$?
          kaggle datasets status ffatty/plaintext-wikipedia-full-hindi --format json >/dev/null 2>/dev/null
          cli_status=$?
          set -e
          echo "Kaggle read-only diagnostics: cli_list=$cli_list, cli_status=$cli_status"
          test "$cli_list" -eq 0
          test "$cli_status" -eq 0
          echo "Kaggle credentials usable in later CI steps"
