name: Wikipedia bundle fleet
on:
  workflow_dispatch:
    inputs:
      languages:
        description: Wikimedia codes; blank selects all existing editions
        type: string
        default: ''
      parallelism:
        description: Concurrent language builders
        type: number
        default: 2
      publish:
        description: Publish identical bundles to ALL three targets
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LANGUAGES: ${{ inputs.languages }}
      PARALLELISM: ${{ inputs.parallelism }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links vendor/wheels huggingface_hub
      - id: plan
        run: |
          [[ "$PARALLELISM" =~ ^[1-8]$ ]] || exit 1
          python scripts/structured_fleet.py plan --only "$LANGUAGES"
  build:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.parallelism }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/article-features-one.yml
    with:
      repo_id: ${{ matrix.repo }}
      publish: ${{ inputs.publish }}
    secrets: inherit
