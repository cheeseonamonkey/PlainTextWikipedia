name: Check publishing credentials (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  huggingface:
    name: HF token access (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links vendor/wheels huggingface_hub
      - name: Check authenticated identity and dataset visibility
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("::error::HF_TOKEN missing")
          api = HfApi(token=token)
          identity = api.whoami()
          api.repo_info("ffatty/plain-text-wikipedia-simpleenglish", repo_type="dataset")
          print(f"HF read access OK: {identity.get('name', 'account')} (write permission not tested)")
          PY

  kaggle:
    name: Kaggle CLI credential check (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links vendor/wheels kaggle six
      - name: Authenticate and check protected existing dataset status
        run: python scripts/kaggle_auth.py --owner ffatty
      - name: Verify CLI remains authenticated in a new CI step
        shell: bash
        run: |
          set -euo pipefail
          unset KAGGLE_TOKEN
          kaggle datasets status ffatty/plain-text-wikipedia-simpleenglish --format json >/dev/null
          echo "Kaggle CLI: authenticated across steps (no publication)"

  zenodo:
    name: Zenodo deposition token (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links vendor/wheels requests
      - name: Check access to account depositions without creating a draft
        run: |
          python - <<'PY'
          import os, requests
          token = os.getenv("ZENODO_TOKEN")
          if not token:
              raise SystemExit("::error::ZENODO_TOKEN missing")
          response = requests.get(
              "https://zenodo.org/api/deposit/depositions",
              headers={"Authorization": f"Bearer {token}"},
              params={"size": 1}, timeout=30,
          )
          response.raise_for_status()
          if not isinstance(response.json(), list):
              raise SystemExit("::error::Zenodo returned unexpected depositions response")
          print("Zenodo deposition read access OK (upload/publish scopes not tested)")
          PY
