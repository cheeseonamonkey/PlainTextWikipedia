name: Test Wikipedia pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_vendor.py
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/actionlint -color
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            REQUIREMENTS.TXT
            requirements-features.txt
      - run: python -m pip install --no-index --find-links vendor/wheels -r REQUIREMENTS.TXT -r requirements-features.txt
      - name: Compile and sanity-check bundle entrypoint
        run: |
          python -m compileall -q scripts tests
          python -m scripts.wikipedia_bundle --help >/dev/null
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
