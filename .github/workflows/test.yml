name: Test Wikipedia pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            REQUIREMENTS.TXT
            requirements-features.txt
      - run: python -m pip install -r REQUIREMENTS.TXT -r requirements-features.txt
      - name: Compile and sanity-check bundle entrypoint
        run: |
          python -m compileall -q scripts tests
          python -m scripts.wikipedia_bundle --help >/dev/null
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
