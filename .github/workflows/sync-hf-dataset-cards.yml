name: Audit Hugging Face Wikipedia dataset cards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-hf-dataset-cards.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - Retry missing Wikipedia shards
      - Build all Wikipedia languages
    types: [completed]

permissions:
  contents: read

jobs:
  metadata:
    name: Verify and document ${{ matrix.language }} dataset
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {language: Simple English, wiki: simplewiki, slug: plain-text-wikipedia-simpleenglish, lang: en, expected: 1}
          - {language: Norwegian, wiki: nowiki, slug: plaintext-wikipedia-full-norwegian, lang: no, expected: 2}
          - {language: Spanish, wiki: eswiki, slug: plaintext-wikipedia-full-spanish, lang: es, expected: 9}
          - {language: French, wiki: frwiki, slug: plaintext-wikipedia-full-french, lang: fr, expected: 10}
          - {language: German, wiki: dewiki, slug: plaintext-wikipedia-full-german, lang: de, expected: 10}
          - {language: Italian, wiki: itwiki, slug: plaintext-wikipedia-full-italian, lang: it, expected: 9}
          - {language: Portuguese, wiki: ptwiki, slug: plaintext-wikipedia-full-portuguese, lang: pt, expected: 9}
          - {language: Russian, wiki: ruwiki, slug: plaintext-wikipedia-full-russian, lang: ru, expected: 10}
          - {language: Chinese, wiki: zhwiki, slug: plaintext-wikipedia-full-chinese, lang: zh, expected: 9}
          - {language: English, wiki: enwiki, slug: plaintext-wikipedia-full-english, lang: en, expected: 10}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: ffatty/${{ matrix.slug }}
      LANGUAGE: ${{ matrix.language }}
      WIKI: ${{ matrix.wiki }}
      LANG_CODE: ${{ matrix.lang }}
      EXPECTED: ${{ matrix.expected }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugging Face API
        run: python -m pip install huggingface_hub
      - name: Check public accessibility and sync metadata without downloading datasets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          e = os.environ
          api = HfApi(token=e["HF_TOKEN"])
          repo = e["HF_REPO"]
          info = api.repo_info(repo_id=repo, repo_type="dataset")
          if info.private:
              print(f"Making the existing dataset public: {repo}", flush=True)
              api.update_repo_settings(repo_id=repo, repo_type="dataset", private=False)
          files = api.list_repo_files(repo_id=repo, repo_type="dataset")
          all_shards = sorted(x for x in files if x.startswith("data/") and x.endswith(".txt.gz"))
          # Never derive source coverage from a hardcoded archive filename suffix.
          # Successful recovery and post-conversion repacking can yield any
          # number of output gzips without changing the number of source roots.
          manifest = None
          if "data/build-manifest.json" in files:
              from huggingface_hub import hf_hub_download
              manifest_file = hf_hub_download(
                  repo_id=repo, repo_type="dataset",
                  filename="data/build-manifest.json", token=e["HF_TOKEN"])
              import json
              manifest = json.loads(Path(manifest_file).read_text(encoding="utf-8"))
              if manifest.get("language") != e["WIKI"]:
                  raise RuntimeError("Published coverage manifest language mismatch")
          shards = all_shards
          card = Path("config/hf-dataset-card.md").read_text()
          substitutions = {
              "__LANG_PROJECT__": e["WIKI"],
              "__LANG_NAME__": e["LANGUAGE"],
              "__LANG_CODE__": e["LANG_CODE"],
              "__HF_REPO__": repo,
              "__SOURCE_URL__": f'https://dumps.wikimedia.org/{e["WIKI"]}/latest/',
              "__REPO_URL__": "https://github.com/cheeseonamonkey/PlainTextWikipedia",
              "__UPSTREAM_URL__": "https://github.com/daveshap/PlainTextWikipedia",
          }
          for k, v in substitutions.items():
              card = card.replace(k, v)
          note = f"## Dataset availability\n\n**{len(shards)} compressed archives currently published.** "
          if manifest:
              expected_roots = int(manifest["expected_shards"])
              recovered_roots = int(manifest["published_shards"])
              source_complete = bool(manifest["complete"])
              note += (
                  f"Source recovery: **{recovered_roots}/{expected_roots} roots**, "
                  f"status **{'COMPLETE' if source_complete else 'PARTIAL'}**. "
                  "See data/build-manifest.json for exact missing or incomplete ranges.\n\n"
              )
              if (manifest.get("published_archives") is not None
                      and int(manifest["published_archives"]) != len(shards)):
                  note += (
                      "**Warning:** Archive count and the publication manifest disagree; "
                      "review before claiming a complete release.\n\n"
                  )
          else:
              note += (
                  "A current source-coverage manifest is unavailable. "
                  "**Archive count alone does not establish complete article coverage.**\n\n"
              )
          card = card.replace("## Format", note + "## Format", 1)
          Path("README-publication.md").write_text(card, encoding="utf-8")
          api.upload_file(repo_id=repo, repo_type="dataset",
                          path_or_fileobj="README-publication.md", path_in_repo="README.md",
                          commit_message=f'Sync {e["LANGUAGE"]} published shard count ({len(shards)}/{expected})')
          print(f"Published metadata: https://huggingface.co/datasets/{repo}: {len(shards)}/{expected}")
          PY
