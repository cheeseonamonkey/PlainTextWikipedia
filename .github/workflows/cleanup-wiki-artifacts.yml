name: Reclaim completed Wikipedia build artifacts

# Retain build artifacts for up to seven days so publisher-only retries
# can reuse validated conversions. Destructive cleanup requires a manual run.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed build run ID to clean explicitly
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: wiki-artifact-cleanup-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Delete only finished-run temporary Wikipedia shard artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          state="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
          [[ "$state" == completed ]] || { echo "::error::Run is not complete; refusing cleanup"; exit 1; }

          # Gather IDs before deletion to avoid pagination shifting.
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name] | @tsv' > "$RUNNER_TEMP/artifacts.tsv"
          count=0
          while IFS=$'\t' read -r id name; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            # Never delete diagnostic reports, retained releases or arbitrary artifacts.
            if [[ "$name" =~ ^(full-[a-z][a-z0-9_-]*wiki-[0-9]+|recovered-[a-z][a-z0-9_-]*wiki-[0-9]+)$ ]]; then
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              count=$((count + 1))
            fi
          done < "$RUNNER_TEMP/artifacts.tsv"
          echo "Deleted $count temporary build artifact(s) from completed run $RUN_ID" \
            | tee -a "$GITHUB_STEP_SUMMARY"
