name: Publish all Wikipedia editions (original + Parquet)

on:
  workflow_dispatch:
    inputs:
      languages:
        description: Optional comma-separated dataset IDs or language slugs (blank = all existing datasets)
        type: string
        required: false
        default: ""
      parallelism:
        description: Simultaneous language publishers (1–12)
        type: number
        default: 8
      mirror_kaggle:
        description: Publish existing Kaggle versions
        type: boolean
        default: true
      publish_zenodo:
        description: Publish/continue Zenodo Parquet DOI releases
        type: boolean
        default: true
      kaggle_stage_mb:
        description: Maximum Kaggle staging per runner (MiB)
        type: number
        default: 5000

permissions:
  contents: read

concurrency:
  group: wikipedia-structured-all
  cancel-in-progress: false

jobs:
  plan:
    name: Find existing Wikipedia editions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      total: ${{ steps.discover.outputs.total }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LANGUAGES: ${{ inputs.languages }}
      PARALLELISM: ${{ inputs.parallelism }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir huggingface_hub
      - id: discover
        run: |
          set -euo pipefail
          if ! [[ "$PARALLELISM" =~ ^[0-9]+$ ]] || (( PARALLELISM < 1 || PARALLELISM > 12 )); then
            echo "::error::parallelism must be 1–12"
            exit 1
          fi
          python scripts/structured_fleet.py plan --only "$LANGUAGES"

  credentials:
    name: Check all requested publisher credentials once
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      WANT_KAGGLE: ${{ inputs.mirror_kaggle }}
      WANT_ZENODO: ${{ inputs.publish_zenodo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir huggingface_hub kaggle six requests
      - name: Read-only publisher preflight
        shell: bash
        run: |
          set -euo pipefail
          args=()
          [[ "$WANT_KAGGLE" == true ]] || args+=(--no-kaggle)
          [[ "$WANT_ZENODO" == true ]] || args+=(--no-zenodo)
          python scripts/publish_preflight.py "${args[@]}"

  publish:
    name: ${{ matrix.repo }}
    needs: [plan, credentials]
    if: ${{ needs.plan.result == 'success' && needs.credentials.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.parallelism }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/structured-wikipedia.yml
    with:
      repo_id: ${{ matrix.repo }}
      mirror_kaggle: ${{ inputs.mirror_kaggle }}
      publish_zenodo: ${{ inputs.publish_zenodo }}
      kaggle_stage_mb: ${{ inputs.kaggle_stage_mb }}
      skip_preflight: true
    secrets: inherit

  summary:
    name: Overall release status
    runs-on: ubuntu-latest
    if: always()
    needs: [plan, credentials, publish]
    steps:
      - name: State results, including partial failures
        env:
          PLAN: ${{ needs.plan.result }}
          PREFLIGHT: ${{ needs.credentials.result }}
          PUBLISH: ${{ needs.publish.result }}
          TOTAL: ${{ needs.plan.outputs.total }}
        run: |
          {
            echo "## Wikipedia fleet release"
            echo "Planned existing datasets: ${TOTAL:-0}"
            echo "Discovery: $PLAN; credentials: $PREFLIGHT; language publishers: $PUBLISH"
            echo "Individual language jobs show exact HF/Kaggle/Zenodo outcomes."
            echo "Retry selected failed languages with the languages input; completed exports are reused."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$PLAN" == success && "$PREFLIGHT" == success && "$PUBLISH" == success ]]
