name: Publish Wikipedia editions to Hugging Face, Kaggle and Zenodo

on:
  workflow_dispatch:
    inputs:
      mirror_kaggle:
        description: Publish new versions of existing Kaggle datasets
        type: boolean
        default: true
      publish_zenodo:
        description: Publish or version Zenodo research records (Parquet only)
        type: boolean
        default: true
      kaggle_stage_mb:
        description: Compressed staging limit per Kaggle runner (MiB); oversized releases fail visibly
        type: number
        default: 5000

permissions:
  contents: read

concurrency:
  group: wikipedia-structured-all
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub
      - id: discover
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/structured_fleet.py plan

  credentials:
    name: Check publisher credentials before any large downloads
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      WANT_KAGGLE: ${{ inputs.mirror_kaggle }}
      WANT_ZENODO: ${{ inputs.publish_zenodo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub kaggle six requests
      - name: Validate destination credentials (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import requests
          from huggingface_hub import HfApi
          e = os.environ
          if not e.get("HF_TOKEN"):
              raise SystemExit("::error::HF_TOKEN missing")
          HfApi(token=e["HF_TOKEN"]).whoami()
          if e["WANT_ZENODO"] == "true":
              if not e.get("ZENODO_TOKEN"):
                  raise SystemExit("::error::ZENODO_TOKEN missing")
              response = requests.get(
                  "https://zenodo.org/api/deposit/depositions",
                  params={"size": 1},
                  headers={"Authorization": "Bearer " + e["ZENODO_TOKEN"]},
                  timeout=30,
              )
              response.raise_for_status()
              if not isinstance(response.json(), list):
                  raise RuntimeError("Unexpected Zenodo account response")
          PY
          if [[ "$WANT_KAGGLE" == true ]]; then
            [[ -n "$KAGGLE_TOKEN" ]] || { echo "::error::KAGGLE_TOKEN missing"; exit 1; }
            python scripts/kaggle_auth.py --owner ffatty
          fi
          echo "All enabled destinations passed read-only authentication checks"

  export:
    name: Publish original + Parquet to three hosts — ${{ matrix.repo }}
    needs: [plan, credentials]
    if: ${{ needs.plan.result == 'success' && needs.credentials.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      REPO: ${{ matrix.repo }}
      WANT_KAGGLE: ${{ inputs.mirror_kaggle }}
      WANT_ZENODO: ${{ inputs.publish_zenodo }}
      MAX_MB: ${{ inputs.kaggle_stage_mb }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub pyarrow requests kaggle six
      - name: Build or reuse current formats; publish to Hugging Face
        id: hf
        shell: bash
        run: |
          set -euo pipefail
          python scripts/structured_fleet.py build --repo "$REPO"

      - name: Publish new version to existing Kaggle dataset (preserve original files)
        if: ${{ steps.hf.outcome == 'success' && inputs.mirror_kaggle }}
        id: kaggle
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/kaggle_auth.py --owner ffatty
          python scripts/structured_kaggle.py --repo "$REPO" --max-mb "$MAX_MB" --require-publish

      - name: Publish or version Zenodo DOI (Parquet only)
        if: ${{ steps.hf.outcome == 'success' && inputs.publish_zenodo }}
        id: zenodo
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_parquet.py --repo "$REPO" --publish

      - name: Require successful publication at each enabled destination
        if: always()
        shell: bash
        env:
          HF_OUTCOME: ${{ steps.hf.outcome }}
          KAGGLE_OUTCOME: ${{ steps.kaggle.outcome }}
          ZENODO_OUTCOME: ${{ steps.zenodo.outcome }}
        run: |
          set -euo pipefail
          echo "### $REPO" >> "$GITHUB_STEP_SUMMARY"
          echo "Hugging Face: $HF_OUTCOME; Kaggle: $KAGGLE_OUTCOME; Zenodo: $ZENODO_OUTCOME" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$HF_OUTCOME" == success ]] || exit 1
          if [[ "$WANT_KAGGLE" == true && "$KAGGLE_OUTCOME" != success ]]; then exit 1; fi
          if [[ "$WANT_ZENODO" == true && "$ZENODO_OUTCOME" != success ]]; then exit 1; fi
